name: PR follow-up validation

on:
  push:
    branches:
      - validation/nvidia-pr-followup-20261118

permissions:
  contents: read

concurrency:
  group: nvidia-pr-followup-validation
  cancel-in-progress: true

jobs:
  validate:
    name: PR ${{ matrix.pr }} focused validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: "727"
            head: "88705de6f0ffc43134f3c1edb5664d07ae4dd648"
            previous: "f9cae8af10fc77df69615c3412c9611e6cbb3c66"
            source: src/skillevaluator/tier3/eval_core/declarative_checks.py
            regression_file: tests/tier3/test_quoted_script_status.py
            regression: test_negated_quoted_script_does_not_claim_the_shell_status
            expected_tests: "6"
            expected_failures: "6"
            suites: >-
              tests/tier3/test_quoted_script_status.py
              tests/tier3/test_declarative_checks.py
              tests/tier3/test_script_invocation_evidence.py
              tests/tier3/test_shell_lexing.py
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ matrix.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[tier3]' 'pytest>=8.4.0' 'ruff>=0.15.4,<0.16'
      - name: Reproduce the review finding on the previous source
        env:
          PREVIOUS: ${{ matrix.previous }}
          HEAD_SHA: ${{ matrix.head }}
          SOURCE: ${{ matrix.source }}
          REGRESSION_FILE: ${{ matrix.regression_file }}
          REGRESSION: ${{ matrix.regression }}
          EXPECTED_TESTS: ${{ matrix.expected_tests }}
          EXPECTED_FAILURES: ${{ matrix.expected_failures }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git show "$PREVIOUS:$SOURCE" > "$SOURCE"
          set +e
          python -m pytest -q -o addopts='' "$REGRESSION_FILE" -k "$REGRESSION" --junitxml="$RUNNER_TEMP/before.xml"
          result=$?
          set -e
          git restore --source="$HEAD_SHA" -- "$SOURCE"
          test "$result" -eq 1
          python - "$RUNNER_TEMP/before.xml" <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET
          suites = ET.parse(sys.argv[1]).getroot().findall("testsuite")
          actual = {
              key: sum(int(suite.attrib.get(key, "0")) for suite in suites)
              for key in ("tests", "failures", "errors")
          }
          expected = {
              "tests": int(os.environ["EXPECTED_TESTS"]),
              "failures": int(os.environ["EXPECTED_FAILURES"]),
              "errors": 0,
          }
          assert actual == expected, (actual, expected)
          print("Previous-source regression counts verified:", actual)
          PY
      - name: Run focused suites against the exact candidate
        env:
          HEAD_SHA: ${{ matrix.head }}
          SUITES: ${{ matrix.suites }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git diff --exit-code
          read -r -a paths <<< "$SUITES"
          python -m pytest -q -o addopts='' "${paths[@]}"
          python -m ruff check src tests
          git diff --check
